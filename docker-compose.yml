include:
  - aim/docker-compose.aim.yml

services:
  neo4j:
    image: neo4j:5-community
    container_name: reco-lab-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"  # browser UI
      - "127.0.0.1:7687:7687"  # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # AIM minimal stack (aim-postgres, aim-backend, aim-frontend, aim-redis) is
  # wired in via the `include:` at the top of this file — see aim/docker-compose.aim.yml.

  ui:
    build:
      context: ./ui
      args:
        VITE_NEO4J_URI: ${VITE_NEO4J_URI}
        VITE_NEO4J_USER: ${VITE_NEO4J_USER}
        VITE_NEO4J_PASSWORD: ${VITE_NEO4J_PASSWORD}
        VITE_AIM_API_URL: ${VITE_AIM_API_URL}
        VITE_AIM_VIEWER_EMAIL: ${VITE_AIM_VIEWER_EMAIL}
        VITE_AIM_VIEWER_PASSWORD: ${VITE_AIM_VIEWER_PASSWORD}
    container_name: reco-lab-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:80"
    depends_on:
      - neo4j
      - aim-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  neo4j-data:
  neo4j-logs:
